plugins {
	id 'java-library'
	id 'maven-publish'
	id 'idea'
	id 'net.neoforged.moddev' version '2.0.140'
}

tasks.named('wrapper', Wrapper).configure {
	distributionType = Wrapper.DistributionType.BIN
}

def resolvedModVersion = mod_version.toString().endsWith("-SNAPSHOT")
		? mod_version.toString().replace("-SNAPSHOT", "-" + new java.text.SimpleDateFormat("yyyyMMdd-HHmmss").format(new Date()) + "-SNAPSHOT")
		: mod_version.toString()
version = "${minecraft_version}-${resolvedModVersion}"
group = mod_group_id

base {
	archivesName = project.archives_base_name
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(21)
	withSourcesJar()
}

neoForge {
	version = project.neo_version

	parchment {
		mappingsVersion = project.parchment_mappings_version
		minecraftVersion = project.parchment_minecraft_version
	}

	runs {
		configureEach {
			systemProperty 'forge.logging.markers', 'REGISTRIES'
			logLevel = org.slf4j.event.Level.DEBUG
		}

		client {
			client()
			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
		}

		server {
			server()
			programArgument '--nogui'
			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
		}

		gameTestServer {
			type = "gameTestServer"
			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
			gameDirectory = project.file('run-gametest')
		}

		data {
			data()
			programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
		}
	}

	mods {
		"${mod_id}" {
			sourceSet(sourceSets.main)
		}
	}
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
	runtimeClasspath.extendsFrom localRuntime
}

repositories {
	maven {
		url = "https://maven.architectury.dev"
		content { includeGroup("dev.architectury") }
	}
	maven { url = "https://maven.createmod.net" }
	maven { url = "https://maven.tterrag.com/" }

	maven {
		url = "https://maven.ryanhcode.dev/releases"
		content {
			includeGroup("dev.ryanhcode.sable")
			includeGroup("dev.ryanhcode.sable-companion")
		}
	}
	maven {
		url = "https://maven.blamejared.com"
		content {
			includeGroup("com.hollingsworth.ars_nouveau")
			includeGroup("mezz.jei")
		}
	}
	maven {
		url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
		content { includeGroup("software.bernie.geckolib") }
	}
	maven {
		url = "https://maven.theillusivec4.top/"
		content { includeGroup("top.theillusivec4.curios") }
	}
	maven {
		url = "https://nexus.covers1624.net/repository/maven-releases/"
		content {
			includeGroup("com.brandon3055.draconicevolution")
			includeGroup("com.brandon3055.brandonscore")
			includeGroup("io.codechicken")
		}
	}
	maven {
		url = "https://api.modrinth.com/maven"
		content { includeGroup("maven.modrinth") }
	}
}

dependencies {
	compileOnly "dev.architectury:architectury-neoforge:${architectury_version}"
	compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
	compileOnly "net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1"

	compileOnly("dev.ryanhcode.sable:sable-neoforge-1.21.1:1.2.2") { transitive = false }
	localRuntime("dev.ryanhcode.sable:sable-neoforge-1.21.1:1.2.2") { transitive = false }
	compileOnly("dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:1.6.0") { transitive = false }

	localRuntime("com.hollingsworth.ars_nouveau:ars_nouveau-1.21.1:5.11.5.1336") { transitive = false }
	localRuntime("software.bernie.geckolib:geckolib-neoforge-1.21.1:4.8.4") { transitive = false }
	localRuntime("top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1") { transitive = false }
	localRuntime("mezz.jei:jei-1.21.1-neoforge:19.27.0.340") { transitive = false }
	localRuntime("maven.modrinth:caelus:7.0.1+1.21.1") { transitive = false }

	localRuntime("maven.modrinth:aether:1.21.1-1.5.10-neoforge") { transitive = false }
	localRuntime("maven.modrinth:owo-lib:0.12.15.5-beta.1+1.21") { transitive = false }

	localRuntime("maven.modrinth:tropicraft:9.8.1-1.21.1") { transitive = false }

	localRuntime("com.brandon3055.draconicevolution:Draconic-Evolution:1.21.1-3.1.4.632") { transitive = false }
	localRuntime("com.brandon3055.brandonscore:BrandonsCore:1.21.1-3.2.1.309") { transitive = false }
	localRuntime("io.codechicken:CodeChickenLib:1.21.1-4.6.1.526") { transitive = false }
}

tasks.withType(ProcessResources).configureEach {
	var replaceProperties = [
		version             : version,
		mod_id              : mod_id,
		mod_name            : mod_name,
		mod_license         : mod_license,
		mod_version         : mod_version,
		mod_authors         : mod_authors,
		mod_description     : mod_description,
		mod_url             : mod_url,
		pack_format         : pack_format,
		minecraft_version   : minecraft_version,
		minecraft_version_range: minecraft_version_range,
		neo_version         : neo_version,
		neo_version_range   : neo_version_range,
		loader_version_range: loader_version_range
	]

	inputs.properties replaceProperties

	filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
		expand replaceProperties
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs << '-Xlint:deprecation'
}

tasks.register('copyGameTestStructures', Copy) {
	from "src/main/resources/data/${mod_id}/gametest/structures"
	into "run-gametest/gameteststructures"
	include '*.snbt'
}

tasks.named('runGameTestServer').configure {
	dependsOn 'copyGameTestStructures'
}

publishing {
	publications {
		register('mavenJava', MavenPublication) {
			from components.java
		}
	}
	repositories {
		maven {
			name = "BreakInBlocks"
			url = version.toString().endsWith("-SNAPSHOT") ?
					"https://maven.breakinblocks.com/snapshots" :
					"https://maven.breakinblocks.com/releases"
			credentials {
				username = System.getenv("MAVEN_USER") ?: ""
				password = System.getenv("MAVEN_TOKEN") ?: ""
			}
		}
	}
}

tasks.register('publishMaven') {
	group = 'publishing'
	dependsOn 'publishMavenJavaPublicationToBreakInBlocksRepository'
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}
