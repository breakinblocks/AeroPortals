plugins {
	id 'java-library'
	id 'maven-publish'
	id 'idea'
	id 'net.neoforged.moddev' version '2.0.140'
}

tasks.named('wrapper', Wrapper).configure {
	distributionType = Wrapper.DistributionType.BIN
}

def resolvedModVersion = mod_version.toString().endsWith("-SNAPSHOT")
		? mod_version.toString().replace("-SNAPSHOT", "-" + new java.text.SimpleDateFormat("yyyyMMdd-HHmmss").format(new Date()) + "-SNAPSHOT")
		: mod_version.toString()
version = "${minecraft_version}-${resolvedModVersion}"
group = mod_group_id

base {
	archivesName = project.archives_base_name
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(21)
	withSourcesJar()
}

neoForge {
	version = project.neo_version

	parchment {
		mappingsVersion = project.parchment_mappings_version
		minecraftVersion = project.parchment_minecraft_version
	}

	runs {
		configureEach {
			systemProperty 'forge.logging.markers', 'REGISTRIES'
			logLevel = org.slf4j.event.Level.DEBUG
		}

		client {
			client()
			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
		}

		server {
			server()
			programArgument '--nogui'
			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
		}

		gameTestServer {
			type = "gameTestServer"
			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
			gameDirectory = project.file('run-gametest')
		}

		data {
			data()
			programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
		}
	}

	mods {
		"${mod_id}" {
			sourceSet(sourceSets.main)
		}
	}
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
	runtimeClasspath.extendsFrom localRuntime
}

repositories {
	maven {
		url = "https://maven.architectury.dev"
		content {
			includeGroup("dev.architectury")
		}
	}

	maven {
		url = "https://maven.createmod.net"
	}

	maven {
		url = "https://maven.tterrag.com/"
	}

	maven {
		url = "https://www.cursemaven.com"
		content { includeGroup "curse.maven" }
	}

}

dependencies {
	compileOnly "dev.architectury:architectury-neoforge:${architectury_version}"
	compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
	compileOnly "net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1"
	compileOnly "curse.maven:sable-1312371:8007005"
	localRuntime "curse.maven:sable-1312371:8007005"
	compileOnly fileTree(dir: 'libs', include: '*.jar')

	// Optional Ars Nouveau portal integration is reflection-based - no compile-time dep.
	// The runtime deps below are needed only so the gametest server can load AN to exercise the
	// full path; AeroPortals itself is fully functional without any of these jars. Using Curse
	// Maven file IDs (rather than Modrinth) because Modrinth's primary-file dispatch serves the
	// Fabric jar for some of these mods at the version slots we want.
	localRuntime "curse.maven:ars-nouveau-401955:8081100"   // 5.11.5
	localRuntime "curse.maven:geckolib-388172:7707149"      // 4.8.4 (neoforge)
	localRuntime "curse.maven:curios-309927:6529130"        // 9.5.1+1.21.1 (neoforge)
	localRuntime "curse.maven:jei-238222:7420587"           // 19.27.0.340 (neoforge)
	localRuntime "curse.maven:caelus-308989:5694215"        // 7.0.1+1.21.1 (neoforge)

	// Optional Aether portal integration is reflection-based - no compile-time dep. Aether
	// bundles nitrogen_internals, cumulus_menus, and accessories via jarJar, but accessories
	// still needs owo-lib at runtime.
	localRuntime "curse.maven:the-aether-255308:7043502"    // 1.5.10 (neoforge 1.21.1)
	localRuntime "curse.maven:owo-lib-532610:6785734"       // 0.12.15.5-beta.1+1.21 (neoforge)

	// Optional Tropicraft compat is reflection-based - no compile-time dep. Tropicraft has no
	// hard third-party deps beyond neoforge + minecraft.
	localRuntime "curse.maven:tropicraft-254794:6600109"    // 9.8.1-1.21.1 (neoforge)

	// Optional Draconic Evolution compat is reflection-based. DE requires Brandon's Core and
	// CodeChicken Lib as hard runtime deps.
	localRuntime "curse.maven:draconic-evolution-223565:7584459"  // 1.21.1-3.1.4.632 (neoforge)
	localRuntime "curse.maven:brandons-core-231382:7130990"       // 1.21.1-3.2.1.309 (neoforge)
	localRuntime "curse.maven:codechicken-lib-1-8-242818:7281427" // 1.21.1-4.6.1.526 (neoforge)
}

tasks.withType(ProcessResources).configureEach {
	var replaceProperties = [
		version             : version,
		mod_id              : mod_id,
		mod_name            : mod_name,
		mod_license         : mod_license,
		mod_version         : mod_version,
		mod_authors         : mod_authors,
		mod_description     : mod_description,
		mod_url             : mod_url,
		pack_format         : pack_format,
		minecraft_version   : minecraft_version,
		minecraft_version_range: minecraft_version_range,
		neo_version         : neo_version,
		neo_version_range   : neo_version_range,
		loader_version_range: loader_version_range
	]

	inputs.properties replaceProperties

	filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
		expand replaceProperties
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs << '-Xlint:deprecation'
}

tasks.register('copyGameTestStructures', Copy) {
	from "src/main/resources/data/${mod_id}/gametest/structures"
	into "run-gametest/gameteststructures"
	include '*.snbt'
}

tasks.named('runGameTestServer').configure {
	dependsOn 'copyGameTestStructures'
}

publishing {
	publications {
		register('mavenJava', MavenPublication) {
			from components.java
		}
	}
	repositories {
		maven {
			name = "BreakInBlocks"
			url = version.toString().endsWith("-SNAPSHOT") ?
					"https://maven.breakinblocks.com/snapshots" :
					"https://maven.breakinblocks.com/releases"
			credentials {
				username = System.getenv("MAVEN_USER") ?: ""
				password = System.getenv("MAVEN_TOKEN") ?: ""
			}
		}
	}
}

tasks.register('publishMaven') {
	description = 'Publishes the mod JAR and sources JAR to the BreakInBlocks Maven repository.'
	group = 'publishing'
	dependsOn 'publishMavenJavaPublicationToBreakInBlocksRepository'
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}
